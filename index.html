}
function findPayment(cost) {
  const r = tryPay(cost, S.tokens.filter(t => t.id !== S.keepMark && t.id !== S.keepMark2));
  return r || tryPay(cost, S.tokens);
}

function exchange(tokId, emo) {
  if (S.over || S.exchangeUsed || (S.supply < 1 && !(partyHas('calc') && !S.calcUsed)) || !BASIC.includes(emo)) return { ok: false, msg: 'You cannot trade right now' };
  const tok = S.tokens.find(t => t.id === tokId);
  if (!tok) return { ok: false, msg: 'That token could not be found' };
  pushUndo({ label: 'Supply trade' });
  const from = tok.t;
  const free = partyHas('calc') && !S.calcUsed;
  if (free) S.calcUsed = true; else S.supply--;
  tok.t = emo; S.exchangeUsed = true; S.actionTaken = true;
  if (free) log('Calculating: this supply trade is free', 'good');
  log(`Spent 1 supply to change a ${EMO[from]} token into ${jo(EMO[emo])}`, 'sys');
  return { ok: true };
}

/* ================= CARDS ================= */
function drawCard(initial) {
  if (!S.deck.length) {
    if (!S.discard.length) return false;
    S.deck = shuffle(S.discard); S.discard = [];
    log('The deck was empty, so the discard was shuffled back in', 'bad');
    if (!initial) addStress(3, 'Deck reshuffle');
  }
  S.hand.push(S.deck.pop());
  return true;
}

function playCard(hi, lane) {
  if (S.over) return { ok: false };
  if (S.p[lane]) return { ok: false, msg: 'That lane already has a card' };
  const card = S.hand[hi]; if (!card) return { ok: false };
  const info = cardInfo(card);
  const pay = findPayment(info.cost);
  if (!pay) return { ok: false, msg: 'Not enough tokens' };
  pushUndo({ label: `Play ${info.name}`, lane });
  const brokeBefore = S.brokeOnce;
  const used = S.tokens.filter(t => pay.includes(t.id));
  S.tokens = S.tokens.filter(t => !pay.includes(t.id));
  if (pay.includes(S.keepMark)) S.keepMark = null;
  if (pay.includes(S.keepMark2)) S.keepMark2 = null;
  S.hand.splice(hi, 1);
  let bonus = 0;
  if (info.comp && used.some(t => t.t === 'bond')) {
    const c = compById(info.comp);
    if (!kwsOf(c).includes('cool')) bonus += 1;
    say(c, 'play');
  } else if (info.comp) say(compById(info.comp), 'play', 0.35);
  S.p[lane] = mkUnit(card, info, bonus);
  S.p[lane].newTurn = S.turn;
  S.p[lane].paid = used.map(t => ({ t: t.t, extra: !!t.extra })); // tokens to return if the card is recalled
  if (info.comp) {
    const c = compById(info.comp); const pl = proLink(c.id);
    if (pl === 'comrade') { S.kept.push(KEYWORDS[c.core].emo); S.p[lane].keptGift = KEYWORDS[c.core].emo; log(`${c.name}: a steady comrade. 1 ${EMO[KEYWORDS[c.core].emo]} token goes to the reserve`, 'good'); }
    if ((pl || bondLevel(c) >= 1) && !(S.cutinSeen = S.cutinSeen || {})[c.id]) {
      S.cutinSeen[c.id] = true;
      const set = linesFor(c, 'play');
      S.cutin = { id: c.id, name: c.name, link: pl, bond: bondLevel(c), line: set.length ? set[Math.floor(lrng() * set.length)].replace(/\{other\}/g, S.pro.name).replace(/\{name\}/g, c.name) : '' };
    }
  }
  UNDO[UNDO.length - 1].uid = S.p[lane].uid;
  S.actionTaken = true;
  log(`Played ${jo(info.name)} in lane ${lane + 1}`, 'sys');
  const mourn = used.filter(t => t.t === 'mourn').length;
  if (mourn) { S.p[lane].bonus += 1; addStress(mourn * (3 + (partyHas('naive') ? 3 : 0)), 'Mourning token'); S.p[lane].noBack = 'A card played with a Mourning token has already raised Stress, so it cannot be recalled'; }
  if (!brokeBefore && S.brokeOnce) { UNDO = []; S.p[lane].noBack = 'Your mind already broke, so this card cannot be recalled'; }
  refreshMend();
  return { ok: true };
}

/* ================= COMBAT MATH ================= */
function effAtk(u, side, lane, why) {
  // v0.27: if a why array is passed, attack changes are collected as [name, amount]. The math itself is unchanged
  let a = u.atk;
  const add = (n, nm) => { if (!n) return; a += n; if (why) why.push([nm, n]); };
  add(u.tempAtk || 0, 'This turn'); add(u.bonus || 0, 'Mourning or a changed bond');
  const row = side === 'p' ? S.p : S.e;
  const kws = unitKws(u);
  if (!kws.includes('proud')) {
    const nb = [lane - 1, lane + 1].filter(n => n >= 0 && n < 4).map(n => row[n]).filter(v => v && v.hp > 0);
    add(nb.filter(v => v.sig.includes('cheer')).length, 'Adjacent Rally');
    if (u.sig.includes('bondS')) add(Math.min(2, nb.length), 'Bonded');
    if (u.comp) add(nb.filter(v => v.sig.includes('bondS')).length, 'Adjacent Bonded');
  }
  if (side === 'p') {
    if (S.counterBuff) add(1, 'Counter');
    if (kws.includes('hot') && S.front <= -S.frontPush) add(1, 'Hotblooded');
    if (kws.includes('proud') && S.front >= S.frontPush) add(1, 'Pride');
    if (kws.includes('timid') && S.front <= -S.frontPush) add(-1, 'Timid');
    if (hasRelic('shoes') && S.front <= -S.frontPush) add(2, 'Worn-Heel Shoes');
    if (u.shield) add(-1, 'Cracked Shield');
    if (u.weak) add(-1, 'Weaken');
    if (u.comp && hasRelic('photo')) { const pc = compById(u.comp); if (pc && pc.status === 'saseon') add(3, 'Half a Photograph'); }
    if (u.comp) {
      if (boardPartners(u, 'crushTo').length) add(1 + (hasTsun(u.comp) ? 1 : 0), 'Show Off');
      const pl = proLink(u.comp); if (pl === 'lover' || pl === 'crush') add(1, PRO_LINKS[pl].name);
      if (S.crushRage[u.comp]) add(2, 'Crush\'s fury');
      if (kws.includes('obsess') && obsessLonely(compById(u.comp))) add(-1, 'Obsession');
      if (kws.includes('compet')) add(Math.min(2, u.kills || 0), 'Competitive');
      if (kws.includes('rebel')) add(S.stress >= 50 ? 2 : -1, 'Defiant');
      if (kws.includes('perfect') && u.hp >= u.maxHp) add(1, 'Perfectionist');
    }
  } else if (S.enemyRage) add(rageAtk(), 'Enemy rage');
  return Math.max(0, a);
}

function damageUnit(u, amt, side, lane, noCover) {
  if (side === 'p') {
    if (!noCover && amt > 0 && hasRelic('cloak') && rng() < 0.10) {
      log(`Tattered Cloak: ${jo(u.name)} dodges the attack`, 'good');
      rec('dodge', { lane, name: u.name });
      return;
    }
    if (!noCover) amt = Math.max(0, amt - (u.wall || 0) - (S.ultShield ? 1 : 0));
    if (amt > 1 && u.sig.includes('armor')) amt -= 1;
    if (!noCover && amt > 0 && !unitKws(u).includes('devote')) {
      for (const n of [lane - 1, lane + 1]) {
        const v = S.p[n];
        if (v && v.hp > 0 && unitKws(v).includes('devote')) { v.hp -= 1; amt -= 1; log(`${jo(v.name)} takes 1 damage in their place (Devotion)`, 'sys'); break; }
      }
    }
    if (amt > 0 && u.comp && amt >= u.hp) {
      if (!noCover) {
        for (const pt of boardPartners(u, 'lover')) {
          if (pt.u.hp < 2) continue;
          const p = Math.min(0.9, (0.30 + (hasTsun(u.comp, pt.u.comp) ? 0.10 : 0) + (hasRelic('ribbon') ? 0.10 : 0)) * (hasRelic('redthread') ? 2 : 1));
          if (rng() < p) {
            u.hp = 1;
            pt.u.hp -= 1;
            addResolve(u); addResolve(pt.u);
            log(`Cover! ${jo(pt.u.name)} spends 1 health to hold ${u.name} at 1`, 'good');
            rec('joint', { kind: 'lover', lanes: [lane, pt.l], text: `Cover: ${pt.u.name} protected ${u.name}` });
            return;
          }
        }
      }
      const c = compById(u.comp);
      if (!S.gritUsed[u.comp] && rng() < gritChance(c)) {
        S.gritUsed[u.comp] = true;
        u.hp = 1;
        log(`Grit! ${jo(u.name)} holds on at 1 health`, 'good');
        rec('grit', { lane, name: u.name });
        addResolve(u);
        return;
      }
      if (hasRelic('pinky') && !S.pinkyUsed) {
        S.pinkyUsed = true;
        u.hp = 1;
        log(`Pinky Promise: ${jo(u.name)} holds on at 1 health`, 'good');
        rec('grit', { lane, name: u.name, label: 'Promise!' });
        addResolve(u);
        addStress(10, 'Pinky Promise');
        return;
      }
    }
    if (amt > 0) addResolve(u);
  }
  u.hp -= amt;
}

const FLY_PUSH_CAP = 3;
function hitFront(side, a, aLane, name, att) {
  if (a <= 0) return;
  if (side === 'p') {
    if (S.momentum) a += 1;
    if (att && att.sig.includes('fly') && (S.wrv || 1) >= 4 && a > FLY_PUSH_CAP) { log(`Flight pushes the Front by at most ${FLY_PUSH_CAP} at once`, 'sys'); a = FLY_PUSH_CAP; }
    S.front += a;
    log(`Front +${a} → ${S.front > 0 ? '+' : ''}${S.front}`, 'good');
    rec('front', { side, a, aLane, name });
  } else {
    if (S.holdFront) { log(`Hold the Line stops ${a} Front damage`, 'good'); rec('hold', { side, a, aLane, name }); return; }
    S.front -= a;
    if (S.stats) S.stats.minFront = Math.min(S.stats.minFront, S.front);
    log(`Front −${a} → ${S.front > 0 ? '+' : ''}${S.front}`, 'bad');
    rec('front', { side, a, aLane, name });
    const st = a * RULE.frontStress + (att && att.sig.includes('threat') ? RULE.threatStress : 0);
    addStress(st, att && att.sig.includes('threat') ? 'Menace, Front pushed back' : 'Front pushed back');
  }
}

function strike(att, side, aLane, t, a) {
  const defSide = side === 'p' ? 'e' : 'p';
  const defRow = side === 'p' ? S.e : S.p;
  let d = defRow[t]; if (d && d.hp <= 0) d = null;
  const flying = att.sig.includes('fly');
  if (flying && !(d && d.sig.includes('watch'))) { hitFront(side, a, aLane, att.name, att); return; }
  if (!d) {
    for (const g of [t - 1, t + 1]) {
      if (g < 0 || g > 3) continue;
      const gu = defRow[g];
      if (gu && gu.hp > 0 && gu.sig.includes('guard')) { defRow[t] = gu; defRow[g] = null; d = gu; log(`${jo(gu.name)} steps in with Guard to block lane ${t + 1}`, 'sys'); rec('guard', { side: defSide, from: g, to: t, name: gu.name }); break; }
    }
  }
  if (!d) { hitFront(side, a, aLane, att.name, att); return; }
  if (side === 'p' && bond3Role(att) === 'atk' && !(S.firstStrike = S.firstStrike || {})[att.comp]) { S.firstStrike[att.comp] = true; a += 2; log(`First Blood! ${jo(att.name)} deals +2 on their first attack`, 'good'); }
  if (att.sig.includes('execute') && d.hp < d.maxHp) { a += 2; log(`Execute! ${jo(att.name)} deals +2 to the wounded ${d.name}`, 'good'); }
  const before = d.hp;
  damageUnit(d, a, defSide, t);
  rec('hit', { side, aLane, t, dmg: before - d.hp, att: att.name, def: d.name });
  if (side === 'p' && att.comp && d.hp > 0) {
    for (const pt of boardPartners(att, 'comrade')) {
      if (d.hp <= 0) break;
      const p = Math.min(0.9, (0.40 + (hasTsun(att.comp, pt.u.comp) ? 0.10 : 0) + (hasRelic('ribbon') ? 0.10 : 0)) * (hasRelic('redthread') ? 2 : 1));
      if (rng() < p) { d.hp -= 1; log(`Follow-up! ${jo(pt.u.name)} deals 1 extra damage to ${d.name}`, 'good'); rec('joint', { kind: 'comrade', lanes: [pt.l], text: `Follow-up: ${pt.u.name} → ${d.name}, 1 extra damage`, target: t }); }
    }
  }
  if (d.sig.includes('thorn') || (defSide === 'p' && d.hp > 0 && bond3Role(d) === 'def')) { const hb = att.hp; damageUnit(att, 1, side, aLane); rec('thorn', { side, aLane, dmg: hb - att.hp, name: att.name }); }
  if (d.hp > 0 && att.sig.includes('poison')) d.poison = true;
  if (defSide === 'p' && d.hp > 0 && att.sig.includes('weaken') && !d.weak) { d.weak = 1; log(`Weaken: ${d.name}'s next attack is reduced by 1`, 'bad'); rec('debuff', { lane: t, label: 'Weaken', text: `Weaken: ${d.name}'s next attack −1` }); }
  if (d.hp <= 0) {
    onKill(att, side);
    if (att.sig.includes('pierce') && a > before) hitFront(side, a - before, aLane, att.name, att);
  }
}

function onKill(att, side) {
  if (side !== 'p') return;
  if (!att.comp && att.card && att.card.cid) S.cardKills[att.card.cid] = (S.cardKills[att.card.cid] || 0) + 1;
  if (att.sig.includes('absorb')) absorbFx(att, laneOf(att));
  if (hasRelic('button') && rng() < 0.25 && S.supply < supplyMax()) { S.supply++; log('Shining Button: Supplies +1', 'good'); }
  if (att.comp) {
    att.kills = (att.kills || 0) + 1;
    S.kills[att.comp] = true; say(compById(att.comp), 'kill', 0.4);
    if (proLink(att.comp) === 'rival' && S.cmdCd > 0) { S.cmdCd--; log(`${jo(att.name)} pulls ahead, and ${jo(S.pro.name)} rises to it. Command cooldown −1`, 'good'); rec('joint', { kind: 'rival', lanes: [laneOf(att)], text: `Rival: ${S.pro.name}'s command cooldown −1` }); }
    for (const pt of boardPartners(att, 'rival')) {
      const n = 1 + (hasTsun(att.comp, pt.u.comp) ? 1 : 0);
      pt.u.tempAtk += n;
      log(`Rivalry! ${jo(pt.u.name)} gains +${n} attack this turn`, 'good');
      rec('joint', { kind: 'rival', lanes: [pt.l], text: `Rivalry: ${pt.u.name} attack +${n} this turn` });
    }
  }
}

function attackPhase(side) {
  const row = side === 'p' ? S.p : S.e;
  for (let lane = 0; lane < 4; lane++) {
    if (S.over || S.phaseBreak) return;
    const u = row[lane];
    if (!u || u.hp <= 0) continue;
    if (side === 'p' && u.ultTurn === S.turn) continue;
    if (side === 'p' && u.sig.includes('coward') && S.stress >= 50) continue;
    const a = effAtk(u, side, lane);
    if (a <= 0) continue;
    if (side === 'p') { addResolve(u); if (u.sig.includes('absorb')) absorbFx(u, lane); }
    if (side === 'e' && u.sig.includes('noise') && (S.noiseNext || 0) < 2) { S.noiseNext = (S.noiseNext || 0) + 1; log(`Noise: ${u.name}'s static turns 1 token next turn into Noise`, 'bad'); rec('debuff', { lane: -1, label: 'Noise', text: `Noise: ${u.name} → 1 token next turn becomes Noise` }); }
    const targets = u.sig.includes('split') ? [lane - 1, lane + 1].filter(n => n >= 0 && n < 4) : [lane];
    for (const t of targets) {
      strike(u, side, lane, t, a);
      if (S.over || S.phaseBreak || u.hp <= 0) break;
    }
    cleanup();
  }
}

function absorbFx(u, lane) {
  const b = S.stress; addStress(-2, 'Absorb');
  if (S.stress < b) rec('absorb', { lane, n: b - S.stress, name: u.name });
}
function cleanup() {
  for (let l = 0; l < 4; l++) {
    const u = S.p[l];
    if (u && u.hp <= 0) {
      rec('die', { side: 'p', lane: l, name: u.name });
      S.p[l] = null;
      if (u.sig.includes('echo')) { S.kept.push(u.emo); log(`${u.name}'s Echo: a ${EMO[u.emo]} token is kept in reserve`, 'good'); }
      if (u.comp) companionDown(u);
      else { S.discard.push(u.card); log(`${jo(u.name)} has fallen`, 'bad'); addStress(RULE.cardLossStress, 'Ally fell'); }
    }
  }
  for (let l = 0; l < 4; l++) {
    const u = S.e[l];
    if (u && u.hp <= 0) { rec('die', { side: 'e', lane: l, name: u.name }); S.e[l] = null; log(`Defeated ${u.name}`, 'good'); if (u.stolen) { S.discard.push(u.stolen); log(`Took back ${jo(cardInfo(u.stolen).name)} (sent to the discard)`, 'good'); } }
  }
  refreshMend();
}

/* Triage: adjacent allies gain +1 health (Rally, but for health). Recalculated whenever cards arrive or leave */
function refreshMend() {
  if (!S) return;
  S.p.forEach((u, l) => {
    if (!u || u.hp <= 0) return;
    let want = 0;
    for (const n of [l - 1, l + 1]) { const v = S.p[n]; if (v && v.hp > 0 && v.sig.includes('mend')) want++; }
    const had = u.mendB || 0;
    if (want !== had) { u.maxHp += want - had; u.hp = Math.max(1, u.hp + want - had); u.mendB = want; }
  });
}

/* ================= COMPANIONS, STRESS ================= */
function companionDown(u) {
  const c = compById(u.comp);
  if (u.saseonAtPlay) { companionDie(c); return; }
  c.status = 'saseon';
  if (S.stats) S.stats.downs++;
  say(c, 'down');
  crushRageFor(c);
  log(`${jo(c.name)} is Critical. One more fall and they die`, 'bad');
  addStress(Math.max(0, (c.merc ? 5 : kwsOf(c).includes('timid') ? 2 : 5) + (kwsOf(c).includes('perfect') ? 5 : 0) + (kwsOf(c).includes('chatty') ? 5 : 0) - (kwsOf(c).includes('indiff') && bondLevel(c) >= 3 ? 3 : 0)), 'Companion Critical');
  redThreadCost(c);
}
function redThreadCost(c) {
  if (!hasRelic('redthread') || c.merc || (S.wrv || 6) >= 8) return;
  if (proLink(c.id) || S.comps.some(o => o.id !== c.id && o.status !== 'dead' && relOf(o.id, c.id))) addStress(5, 'Red Thread');
}

function crushRageFor(c) {
  for (const o of S.comps) {
    if (o.status !== 'dead' && relOf(o.id, c.id) === 'crushTo' && !S.crushRage[o.id]) {
      S.crushRage[o.id] = true;
      log(`${jo(o.name)} sees ${c.name} go down and flares up. Attack +2 for this battle`, 'good');
      { const ol = S.p.findIndex(u => u && u.comp === o.id); rec('joint', { kind: 'crush', lanes: ol >= 0 ? [ol] : [], ids: [o.id, c.id], text: `Show Off: ${jo(o.name)} flares up. Attack +2 for this battle` }); }
    }
  }
}
function pairReaction(c) {
  for (const o of S.comps) {
    if (o.status === 'dead' || o.id === c.id || !relOf(o.id, c.id)) continue;
    const revenge = kwsOf(o).includes('obsess') ? true : rng() < 0.5;
    o.atkMod = (o.atkMod || 0) + (revenge ? 1 : -1);
    const bu = S.p.find(u => u && u.comp === o.id);
    if (bu) bu.bonus += revenge ? 1 : -1;
    log(revenge ? `${jo(o.name)} swears revenge. Attack +1 for the rest of the run` : `${jo(o.name)} breaks under the grief. Attack −1 for the rest of the run`, revenge ? 'good' : 'bad');
  }
}
function companionDie(c) {
  if (c.status === 'dead') return;
  const lvl = bondLevel(c);
  c.status = 'dead';
  if (S.stats) S.stats.deaths++;
  say(c, 'death');
  const wit = S.comps.filter(o => o.status !== 'dead' && !o.merc);
  if (wit.length) say(wit[Math.floor(lrng() * wit.length)], 'witness', undefined, c.name);
  log(`${c.name} has died. 2 tokens become Mourning tokens`, 'bad');
  S.mournCount += 2;
  crushRageFor(c);
  pairReaction(c);
  S.hand = S.hand.filter(x => x.comp !== c.id);
  S.deck = S.deck.filter(x => x.comp !== c.id);
  S.discard = S.discard.filter(x => x.comp !== c.id);
  for (let l = 0; l < 4; l++) if (S.p[l] && S.p[l].comp === c.id) S.p[l] = null;
  let s = c.merc ? 10 : lvl >= 3 ? 20 : 15;
  if (kwsOf(c).includes('indiff') || kwsOf(S.pro).includes('indiff')) s = Math.floor(s / 2);
  if (partyHas('kind')) s += 5;
  if (hasRelic('ring')) s = Math.max(0, s - 10);
  addStress(s, 'Companion died');
  redThreadCost(c);
}

function addStress(n, why) {
  if (!n) return;
  const before = S.stress;
  S.stress = Math.max(0, Math.min(100, S.stress + n));
  if (S.stats) S.stats.maxStress = Math.max(S.stats.maxStress, S.stress);
  const d = S.stress - before;
  if (d) log(`Stress ${d > 0 ? '+' : ''}${d} (${why}) → ${S.stress}`, d > 0 ? 'bad' : 'good');
  { const step = hasRelic('candle') ? 35 : 25; if (d > 0 && S.stress < 100 && Math.floor(S.stress / step) > Math.floor(before / step)) S.stressNote = Math.floor(S.stress / step) * step; }
  if (S.stress >= 100 && !S.over) {
    if (!S.brokeOnce) { S.brokeOnce = true; breakRoll(); S.stress = 60; }
    else { S.over = 'runover'; S.overReason = 'Your mind hit its limit a second time, and you collapsed'; log(S.overReason, 'bad'); }
  }
}

const BREAK_TEXT = {
  fear3: 'Breakdown: Fear tokens permanently +3', noSig: 'Breakdown: you no longer draw a guaranteed signature token', handMinus: 'Breakdown: starting hand −1 from the next battle on',
  sig2: 'Awakening: you draw 2 guaranteed signature tokens each turn', bustImmune: 'Awakening: ignore 1 Burst per battle', crisisAlways: 'Awakening: Crisis skills can be used no matter where the Front sits',
};
function breakRoll() {
  UNDO = [];
  const awaken = rng() < 0.3;
  const opts = awaken ? ['sig2', 'bustImmune', 'crisisAlways'] : ['fear3', 'noSig', 'handMinus'];
  const o = opts[rint(3)];
  S.effects[o] = true;
  S.lastBreak = { awaken, o, turn: S.turn };
  S.breakNote = { awaken, o };
  log(`Mind at its limit! ${BREAK_TEXT[o]}. Stress returns to 60`, awaken ? 'good' : 'bad');
  say(S.pro, awaken ? 'awaken' : 'collapse');
}

/* ================= COMMANDS, CRISIS ================= */
function cmdReady() { return !S.over && S.cmdCd === 0; }
function useCommand(tg) {
  if (!cmdReady()) return { ok: false, msg: 'Your command is not ready yet' };
  pushUndo({ label: `Command: ${COMMANDS[S.pro.cmd].name}` });
  const r = commandApply(tg);
  refreshMend();
  if (!r.ok) UNDO.pop();
  else if (S.stats) S.stats.commands++;
  return r;
}
function commandApply(tg) {
  const k = S.pro.cmd; const cm = COMMANDS[k];
  const fail = msg => ({ ok: false, msg });
  switch (k) {
    case 'charge': { const u = S.p[tg.lane]; if (!u) return fail('Choose an ally'); u.tempAtk += 2; break; }
    case 'focus': { const u = S.e[tg.lane]; if (!u) return fail('Choose an enemy'); damageUnit(u, 2, 'e', tg.lane); cleanup(); break; }
    case 'momentum': S.momentum = true; break;
    case 'wall': {
      const u = S.p[tg.lane]; if (!u) return fail('Choose an ally');
      u.wall = Math.max(u.wall || 0, 2);
      for (const n of [tg.lane - 1, tg.lane + 1]) { const v = S.p[n]; if (v) v.wall = Math.max(v.wall || 0, 1); }
      break;
    }
    case 'shift': { const u = S.p[tg.from]; if (!u || S.p[tg.to]) return fail('Choose an ally and an empty lane'); S.p[tg.to] = u; S.p[tg.from] = null; u.tempAtk = (u.tempAtk || 0) + 1; break; }
    case 'delay': { const t = S.tele[tg.lane]; if (!t) return fail('Choose an incoming enemy'); t.delay = 1; t.hp = Math.max(1, t.hp - 2); break; }
    case 'soothe': addStress(-10, 'Soothe'); break;
    case 'reroll': {
      const tok = S.tokens.find(t => t.id === tg.tok); if (!tok) return fail('Choose a token to change');
      if (!BASIC.includes(tg.emo)) return fail('Choose an emotion');
      const from = tok.t; tok.t = tg.emo;
      log(`Changed a ${EMO[from]} token into ${jo(EMO[tg.emo])}`, 'sys');
      break;
    }
    case 'heal': { const u = S.p[tg.lane]; if (!u) return fail('Choose an ally'); u.hp = Math.min(u.maxHp, u.hp + 3); u.poison = false; break; }
  }
  S.cmdCd = hasRelic('whistle') ? 2 : 3; S.actionTaken = true;
  if (hasRelic('whistle') && (S.wrv || 6) >= 8) addStress(2, 'Rusty Whistle');
  log(`Command: ${cm.name}`, 'sys');
  return { ok: true };
}

function useUlt(lane) {
  const u = S.p[lane];
  if (S.over || !ultReady(u)) return { ok: false, msg: 'You cannot use an Ultimate' };
  const c = compById(u.comp);
  pushUndo({ label: `Ultimate: ${c.ultName || ULTS[c.role].def}` });
  S.ultUsed[u.comp] = true; u.resolve = 0; u.ultTurnUsed = S.turn; S.actionTaken = true;
  const name = c.ultName || ULTS[c.role].def;
  log(`Ultimate: ${name}!`, 'good');
  const set = linesFor(c, 'ult');
  if (set.length) log(`${c.name}: “${set[Math.floor(lrng() * set.length)].replace(/\{ult\}/g, name).replace(/\{other\}/g, S.pro.name)}”`, 'line');
  if (c.role === 'atk') { u.ultTurn = S.turn; strike(u, 'p', lane, lane, effAtk(u, 'p', lane) * 2); cleanup(); UNDO = []; }
  if (c.role === 'def') S.ultShield = true;
  if (c.role === 'sup') { addStress(-10, 'Ultimate'); S.p.forEach(v => { if (v) { v.maxHp += 1; v.hp += 1; } }); }
  return { ok: true };
}

function crisisReady() { return !S.over && !S.crisisUsed && (S.front <= -S.frontPush || !!S.effects.crisisAlways); }
function useCrisis() {
  if (!crisisReady()) return { ok: false };
  const k = ROLES[S.pro.role].crisis;
  pushUndo({ label: `Crisis: ${CRISIS[k].name}` });
  if (k === 'counter') S.counterBuff = true;
  if (k === 'hold') S.holdFront = true;
  if (k === 'rally') { S.tokens.push(mkTok('bond')); drawCard(); }
  S.crisisUsed = true; S.actionTaken = true;
  log(`Crisis skill: ${CRISIS[k].name}`, 'good');
  if (k === 'rally') UNDO = [];
  return { ok: true };
}

/* ================= TURN FLOW ================= */
function reinforcementLimit() { return S.enc.elite ? 6 : 5; }
function fillTele() {
  // Boss scripts retain their original phase timing and one-at-a-time loop.
  if (S.enc.boss) {
  let list;
  if (S.waveIdx < S.waves.length) { list = S.waves[S.waveIdx]; S.waveIdx++; }
  else { let n = rng() < 0.4 + 0.03 * ((S.floor || 1) - 1) ? 2 : 1;
    // v0.27: once a boss fight's scripted reinforcements end, only 1 arrives at a time, and none if 5 or more enemies (including incoming) are already out
    if (S.enc.boss) { const cnt = S.e.concat(S.tele).filter(u => u && u.hp > 0).length; n = cnt >= 5 ? 0 : 1; }
    list = []; for (let i = 0; i < n; i++) list.push([rint(4), S.loop[rint(S.loop.length)]]); }
  for (const [lane, key] of list) {
    let l = lane;
    if (S.tele[l]) { const em = [0, 1, 2, 3].filter(i => !S.tele[i]); if (!em.length) continue; l = em[rint(em.length)]; }
    S.tele[l] = mkEnemy(key);
  }
    return;
  }
  // Persist pending scripted units instead of dropping a wave when the board is full.
  S.wavePending = S.wavePending || [];
  if (S.loopRemaining === undefined) S.loopRemaining = S.enc.elite ? 6 : 4;
  let space = Math.min(4 - S.tele.filter(Boolean).length,
    reinforcementLimit() - S.e.concat(S.tele).filter(u => u && u.hp > 0).length);
  if (space <= 0) return;
  if (!S.wavePending.length && S.waveIdx < S.waves.length) {
    S.wavePending = S.waves[S.waveIdx++].map(x => x.slice());
    // Empty authored waves remain a genuine rest turn.
    if (!S.wavePending.length) return;
  }
  if (S.wavePending.length) {
    while (space-- > 0 && S.wavePending.length) {
      const [lane,key] = S.wavePending.shift();
      const free = [0,1,2,3].filter(i => !S.tele[i]);
      const l = S.tele[lane] ? free[rint(free.length)] : lane;
      S.tele[l] = mkEnemy(key);
    }
    return;
  }
  // Finite reserves: one unit, followed by at least one full turn without a new reserve.
  if (S.loopRemaining <= 0 || (S.nextReserveTurn !== undefined && S.turn < S.nextReserveTurn)) return;
  const free = [0,1,2,3].filter(i => !S.tele[i]);
  S.tele[free[rint(free.length)]] = mkEnemy(S.loop[rint(S.loop.length)]);
  S.loopRemaining--; S.nextReserveTurn = S.turn + 2;
  if (!S.loopRemaining) log('That was the enemy\'s last reserve. No more reinforcements after this.', 'sys');
}

function enemyTurn() {
  S.phaseBreak = false;
  attackPhase('e');
  S.phaseBreak = false;
  if (S.over) return;
  const dl = [];
  for (let l = 0; l < 4; l++) {
    const t = S.tele[l];
    if (t && !S.e[l]) { if (t.delay > 0) { t.delay--; continue; } S.e[l] = t; S.tele[l] = null; dl.push(l); }
  }
  if (dl.length) rec('descend', { lanes: dl });
  const pl = { p: [], e: [] };
  [['p', S.p], ['e', S.e]].forEach(([sd, row]) => row.forEach((u, l) => { if (u && u.poison) { u.hp -= 1; pl[sd].push(l); } }));
  if (pl.p.length || pl.e.length) rec('poison', { lanes: pl });
  cleanup();
  if (S.over) return;
  const healed = new Set();
  for (let l = 0; l < 4; l++) {
    const u = S.p[l]; if (!u || !u.comp) continue;
    for (const pt of boardPartners(u, 'family')) {
      if (Math.abs(pt.l - l) !== 1) continue;
      const key = [u.uid, pt.u.uid].sort().join('-'); if (healed.has(key)) continue; healed.add(key);
      const n = 1 + (hasTsun(u.comp, pt.u.comp) ? 1 : 0);
      u.hp = Math.min(u.maxHp, u.hp + n); pt.u.hp = Math.min(pt.u.maxHp, pt.u.hp + n);
      log(`Care: ${u.name} and ${pt.u.name} each heal ${n}`, 'good');
      rec('joint', { kind: 'family', lanes: [l, pt.l], text: `Care: ${u.name} and ${pt.u.name} heal ${n}` });
    }
  }
  S.ultShield = false;
  if (bossRule('fear')) { S.bossFear++; log(`${S.e.find(u => u && u.boss) ? S.e.find(u => u && u.boss).name : 'The boss'}'s gaze: 1 Fear token is added to the pouch`, 'bad'); }
  if (bossRule('steal') && S.doomRef) stealResolve();
  if (bossRule('forget') && S.hand.length) {
    const [c] = S.hand.splice(rint(S.hand.length), 1); S.discard.push(c);
    log(`Oblivion: forgot ${jo(cardInfo(c).name)} (sent to the discard)`, 'bad');
  }
  fillTele();
  S.p.forEach(u => { if (u) u.wall = 0; });
  S.holdFront = false;
}

function endTurn() {
  if (S.over) return;
  S.events = []; S.recording = true;
  try { endTurnInner(); } finally { S.recording = false; }
}
function endTurnInner() {
  for (const id of [S.keepMark, hasRelic('pouch') ? S.keepMark2 : null]) { if (id == null) continue; const tok = S.tokens.find(t => t.id === id); if (tok) S.kept.push(tok.t); }
  S.keepMark = null; S.keepMark2 = null; S.tokens = [];
  attackPhase('p');
  S.phaseBreak = false;
  S.p.forEach(u => { if (u) u.weak = 0; });
  if (S.over) return;
  S.counterBuff = false; S.momentum = false;
  const alliesBeforeEnemy = S.p.filter(Boolean).length;
  enemyTurn();
  if (S.over) return;
  S.fallenThisTurn = Math.max(0, alliesBeforeEnemy - S.p.filter(Boolean).length);
  if (resolveFront()) return;
  startTurn();
}
/* The Front is judged only after a full turn (your attacks, then the enemy's reply) */
function resolveFront() {
  if (S.front >= S.frontMax) {
    reachEnemyEnd();
    if (S.over) return true;
    fillTele();
    return false;
  }
  if (S.front <= -S.frontMax) { reachOwnEnd(); return true; }
  return false;
}

function reachEnemyEnd() {
  if (S.enc.boss && S.phase === 1) {
    S.phase = 2; S.front = 0; S.tele = [null, null, null, null];
    if (S.enc.evolve) {
      const [from, to] = S.enc.evolve;
      let l = S.e.findIndex(u => u && u.key === from);
      if (l < 0) { const b = (S.enc.board || []).indexOf(from); l = b >= 0 && !S.e[b] ? b : S.e.findIndex(u => !u); if (l < 0) l = Math.max(0, b); }
      S.e[l] = mkEnemy(to);
    }
    S.waves = S.enc.waves2; S.loop = S.enc.loop2; S.waveIdx = 0; S.phaseBreak = true;
    rec('phase', {});
    log(encText('phaseLog'), 'bad');
    return;
  }
  S.overflow = Math.min(2, S.front - S.frontMax); S.front = S.frontMax;

function startEvent(run, node) {
  if (node.type === 'legacy' && run.legacy) { run.event = { key: 'legacy', done: false }; return; }
  if (node.recruit && !run.recruited) { run.event = { key: 'recruit', done: false }; return; }
  if ((run.stage || 1) === 2) {
    const pending = Object.keys(THREAD_EVENTS).find(k => (run.eventThreads || {})[k] && !run.usedEvents.includes(THREAD_EVENTS[k]));
    if (pending) { const key = THREAD_EVENTS[pending]; run.usedEvents.push(key); run.event = { key, done: false }; return; }
  }
  // 관계 이벤트: 관계마다 여러 개 중 아직 안 본 것(첫 번째는 예전과 같은 'rel:관계' 표시를 씁니다)
  const relCands = [];
  for (const p of relPairs(run)) relVariants(p.type).forEach((_, v) => { const tag = v ? `rel:${p.type}:${v + 1}` : `rel:${p.type}`; if (!run.usedEvents.includes(tag)) relCands.push({ p, v, tag }); });

  }
  if (!run.usedEvents.includes('gamja') && Math.random() < 0.06) { run.usedEvents.push('gamja'); run.event = { key: 'gamja', done: false }; return; }

  const pool = here.filter(k => !run.usedEvents.includes(k));

  run.usedEvents.push(key); run.event = { key, done: false };
}

const DECK_FLEX = ['hound', 'wire', 'flag'];

function renderMap() {
  const r = RUN; const nodes = r.map.nodes;

  const curFloor = r.pos != null && nodes[r.pos] ? nodes[r.pos].floor : 0;
  // 선은 지금 서 있는 칸에서 앞으로 갈 수 있는 길만 그립니다
  const ahead = new Set(r.pos != null && nodes[r.pos] ? [r.pos] : nodes.filter(n => n.floor === 1).map(n => n.id));
  for (const n of [...nodes].sort((a, b) => a.floor - b.floor)) if (ahead.has(n.id)) n.next.forEach(id => ahead.add(id));
  for (const n of nodes) for (const id of n.next) {
    const m = nodes[id];
    const on = path.has(n.id) && path.has(m.id);
    // 걸어온 길(두꺼운 선)은 항상 남기고, 점선은 지금 칸에서 앞으로 갈 수 있는 길만
    if (!on && (m.floor <= curFloor || !ahead.has(n.id))) continue;
    lines.push(`<line x1="${X(n.col)}" y1="${Y(n.floor)}" x2="${X(m.col)}" y2="${Y(m.floor)}" class="${on ? 'walked' : ''}" vector-effect="non-scaling-stroke"/>`);
  }
  const btns = nodes.map(n => {
    const cls = ['node', `n-${n.type}`];
    if (path.has(n.id)) cls.push('visited');
    else if (n.floor <= curFloor) cls.push('past');
    if (n.id === r.pos) cls.push('current');
    const can = reach.has(n.id);
    if (can) cls.push('reach');
    return `<button class="${cls.join(' ')}" style="left:${X(n.col)}%;top:${Y(n.floor)}px" data-act="node" data-id="${n.id}"${can ? '' : ' disabled'} aria-label="Floor ${n.floor} ${NODE_MARK[n.type]}">${NODE_MARK[n.type]}</button>`;
  }).join('');

    ${runHead()}
    <p class="soft small">Choose where to go next. Each floor costs 1 supply.</p>

      <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">${lines.join('')}</svg>
      ${floorLabels}${btns}
    </section>
    ${r.fromPrep ? '<button class="btn ghost" data-act="to-title">Title<small>Your progress is saved</small></button>' : '<button class="btn ghost" data-act="setup">Abandon run</button>'}
    ${deckOverlay()}${cardSheet()}${relicOfferHtml()}
  </main>`;
  const cur = app.querySelector('.node.reach') || app.querySelector('.node.current');

/* ---------- 런 시작 ---------- */
function buildRun(mode) {
  fixSetup();
  const P = charById(SETUP.pro); if (!P) return null;
  const toComp = key => {
    const ch = charById(SETUP[key]); if (!ch) return null;
    return { id: ch.id, name: ch.name, role: ch.role, core: ch.core, aux: ch.aux.slice(), sigil: ch.sigil, speech: ch.speech, lines: { ...ch.lines }, ultName: ch.ultName || '',
      status: SETUP[key + 'st'], bondPts: bondPtsForLevel(ch, +SETUP[key + 'bond']) };
  };
  const comps = [toComp('c1'), toComp('c2')].filter(Boolean);
  const ids = [P.id, ...comps.map(c => c.id)];
  const bench = ROSTER.chars.filter(c => !ids.includes(c.id)).map(ch => ({ id: ch.id, name: ch.name, role: ch.role, core: ch.core, aux: ch.aux.slice(), sigil: ch.sigil, speech: ch.speech, lines: { ...ch.lines }, ultName: ch.ultName || '' }));
  return newRun({ mode, pro: { id: P.id, name: P.name, role: P.role, cmd: P.cmd, core: P.core, aux: P.aux.slice(), speech: P.speech, lines: { ...P.lines } },
    comps, stress: +SETUP.stress, supply: +SETUP.supply, bench,
    rels: ROSTER.rels.filter(x => ROSTER.chars.some(c => c.id === x.a) && ROSTER.chars.some(c => c.id === x.b)) });
}
function startMapRun() {
  RUN = buildRun('map'); if (!RUN) return;
  RUN.map = genMap();

/* ---------- 입력 ---------- */
function onRunAct(act, d) {
  if (onReportAct(act)) return true;
  switch (act) {
    case 'start-map': startMapRun(); return true;
    case 'new-map-run': if (RUN && RUN.fromPrep) startGameRun(); else startMapRun(); return true;
    case 'relic-info': flash(`${RELICS[d.k].name}: ${relicDesc(d.k)}`); return true;
    case 'card-info': UI.cinfo = { ctx: d.ctx, k: d.k, i: d.i !== undefined ? +d.i : undefined, cid: d.cid }; render(); return true;
    case 'close-cinfo': UI.cinfo = null; render(); return true;
    case 'legacy-sel': RUN.legacySel = RUN.legacySel === d.cid ? null : d.cid; render(); return true;
    case 'legacy-confirm': { const r = leaveLegacy(RUN, RUN.legacySel); if (!r.ok) flash(r.msg); render(); return true; }
    case 'reveal-next': fadeReveal(() => { UI.revealQ.shift(); render(); }); return true;
    case 'show-deck': UI.deckOpen = true; UI.picking = null; UI.fuseSel = []; render(); return true;
    case 'close-deck': UI.deckOpen = false; UI.picking = null; UI.fuseSel = []; render(); return true;
    case 'node': {
      const res = moveTo(RUN, +d.id);
      if (!res.ok) { flash(res.msg); return true; }
      UI.mapScrolled = false;
      if (RUN.over) { screen = 'runend'; render(); return true; }
      const n = res.node;
      if (res.msg) UI.pendingToast = res.msg;
      if (n.type === 'battle' || n.type === 'elite' || n.type === 'boss') startRunBattle(encFor(n, RUN.stage));
      else if (n.type === 'event' || n.type === 'legacy') { startEvent(RUN, n); screen = 'event'; render(); }
      else if (n.type === 'camp') { RUN.camped = false; RUN.lastCamp = null; RUN.fused = false; RUN.lastFuse = null; screen = 'camp'; render(); }
      else if (n.type === 'trade') { makeShop(RUN); screen = 'trade'; render(); }
      window.scrollTo(0, 0);
      if (UI.pendingToast) { const t = UI.pendingToast; UI.pendingToast = null; flash(t); }
      return true;
    }
    case 'ev-choose': { const had = deckCids(); const r = chooseEvent(RUN, +d.i); if (!r.ok && r.msg) flash(r.msg); if (RUN.over) { screen = 'runend'; } else gainReveal(had); render(); return true; }
    case 'to-map': if (RUN && (RUN.pendingRelic || (RUN.pendingRelicChoices && RUN.pendingRelicChoices.length))) { render(); return true; } UI.deckOpen = false; screen = RUN.over ? 'runend' : RUN.stageDone ? 'stage' : 'map'; render(); window.scrollTo(0, 0); return true;
    case 'next-stage': { const r = advanceStage(RUN); if (!r.ok) return true; placeLegacy(RUN); UI.mapScrolled = false; screen = 'map'; render(); window.scrollTo(0, 0); flash(r.text); return true; }
    case 'buy-card': { const had = deckCids(); const r = buyCard(RUN, +d.i); UI.cinfo = null; if (!r.ok) flash(r.msg); else { gainReveal(had); render(); } return true; }
    case 'buy-relic': { const r = buyRelic(RUN); if (!r.ok) flash(r.msg); else { sfx('gain'); render(); } return true; }
    case 'break-ok': { if (S) S.breakNote = null; if (RUN) RUN.breakNote = null; render(); return true; }
    case 'relic-choose': { const k = d.k; if (k && RUN.pendingRelicChoices && RUN.pendingRelicChoices.includes(k) && !RUN.relics.includes(k) && relicFull(RUN)) { RUN.pendingRelicChoices = null; offerRelic(RUN, k); render(); return true; } if (k && RUN.pendingRelicChoices && RUN.pendingRelicChoices.includes(k) && !RUN.relics.includes(k)) { RUN.relics.push(k); gainSupply(RUN, 0); sfx('gain'); flash(`Took ${RELICS[k].name}`); } RUN.pendingRelicChoices = null; render(); return true; }
    case 'relic-take': case 'relic-leave': { const k = RUN.pendingRelic; takePendingRelic(RUN, act === 'relic-take'); if (act === 'relic-take') sfx('gain'); if (k) flash(act === 'relic-take' ? `Took ${RELICS[k].name}` : `Left ${RELICS[k].name} behind`); render(); return true; }
    case 'relic-swap': { if (UI.relicSwapAsk !== d.k) { UI.relicSwapAsk = d.k; render(); return true; } UI.relicSwapAsk = null; const r = swapRelic(RUN, d.k); if (r.ok) sfx('gain'); if (r.ok) flash(`Dropped ${RELICS[d.k].name} and took ${RELICS[r.k].name}`); render(); return true; }
    case 'relic-drop': { if (UI.relicDropAsk !== d.k) { UI.relicDropAsk = d.k; render(); return true; } UI.relicDropAsk = null; const r = discardRelic(RUN, d.k); if (r.ok) flash(`Dropped ${RELICS[d.k].name}`); render(); return true; }
    case 'shop-refresh': { const r = refreshShop(RUN); if (!r.ok) flash(r.msg); else render(); return true; }
    case 'pick-remove': UI.deckOpen = true; UI.picking = 'remove'; render(); return true;
    case 'pick-fuse': UI.deckOpen = true; UI.picking = 'fuse'; UI.fuseSel = []; render(); return true;
    case 'pick-card': {
      if (UI.picking === 'remove') { const r = removeCard(RUN, d.cid); UI.deckOpen = false; UI.picking = null; UI.cinfo = null; if (!r.ok) flash(r.msg); else flash(`Removed ${r.name} from the deck`); return true; }

    }

  const pages = [
    { head: 'The last door', text: 'When the Lord of Oblivion falls, the door at the peak opens. Inside, countless shards of light are drifting. The memories the Tower took.' },
    { head: 'What you took back', text: 'Close your hand on one light and you hear someone laugh. A name comes back. A face. A street you walked together.' },

  if (ROSTER.chars.length >= rosterSlots()) { flash('The roster is full'); return; }

  ROSTER.chars.unshift(ch); saveRoster();
  PREP.pro = ch.id; PREP.init = false;
  const m = meta(); m.firstChar = true; saveMeta();
  screen = 'base'; render(); window.scrollTo(0, 0); flash(`${name} joined the roster`);

  const byName = arr => { const m = {}; arr.forEach(c => { const n = cardInfo(c).name; m[n] = (m[n] || 0) + 1; }); return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0], 'en')).map(([n, k]) => `<li>${esc(n)}${k > 1 ? ` ×${k}` : ''}</li>`).join('') || '<li class="soft">None</li>'; };
  const gone = S.comps.filter(c => !S.deck.some(x => x.comp === c.id) && !S.hand.some(x => x.comp === c.id) && !S.p.some(u => u && u.comp === c.id) && !S.discard.some(x => x.comp === c.id));
  return `<div class="sheet top"><div class="sheet-body pile-sheet">
    <h2>Deck and discard</h2>
    <p class="soft small">The hand does not refill the moment it shrinks. At the start of the next turn you draw 1 from the deck first, then fill up to 3 if the hand is under that, as far as you can. If the counter felled 2 or more allied cards, the next turn fills up to 4. Cards still standing are not in the deck. Fallen nameless cards go to the discard. Only when the deck is empty do you shuffle the discard to draw, and then Stress rises by 3, once. A fallen companion card is out of this battle.</p>
    <div class="pile-cols">
      <div><h3>Deck ${S.deck.length} <small class="soft">(draw order is a secret)</small></h3><ul>${byName(S.deck)}</ul></div>
      <div><h3>Discard ${S.discard.length}</h3><ul>${byName(S.discard)}</ul></div>
    </div>
    ${gone.length ? `<p class="soft small">Companions out of this battle: ${gone.map(c => esc(c.name)).join(', ')}</p>` : ''}
    <button class="btn" data-act="close-pile">Close</button>
  </div></div>`;
}
function fadeReveal(fn) {
  const el = app.querySelector('.reveal');
  if (!el || REDUCED) { fn(); return; }
  if (el.classList.contains('leaving')) return;
  el.classList.add('leaving');
  setTimeout(fn, 300);
}
function resetUI() { UI.retryAsk = false; UI.mode = null; UI.sel = null; UI.from = null; UI.exTok = null; UI.info = null; UI.focus = null; }
function flash(msg) {
  showFx('toast', `<div class="toast-float" role="status">${esc(msg)}</div>`, 2200);

}
function signed(n) { return n > 0 ? `+${n}` : `${n}`; }

function opt(v, label, cur) { return `<option value="${v}"${v === cur ? ' selected' : ''}>${esc(label)}</option>`; }
function kwOptions(cur) {

}
function avatar(ch, cls) {
  cls = (cls || '') + (ch && !ch.merc ? frameCls() : '');
  if (ch && ch.portrait) return `<img class="av ${cls}" src="${ch.portrait}" alt="">`;
  return `<span class="av ph ${cls}">${esc((ch && ch.name ? ch.name : '?').slice(0, 1))}</span>`;
}
function titleHtml(ch) { const t = charTitle(ch); return t ? `<span class="ctitle">${esc(t)}</span>` : ''; }
function charSummary(ch) {

}

function saveDraft() {
  const d = UI.draft;
  if (!draftValid(d)) return;
  d.name = d.name.trim(); d.ultName = (d.ultName || '').trim();
  const i = ROSTER.chars.findIndex(c => c.id === d.id);
  if (i >= 0) ROSTER.chars[i] = d; else ROSTER.chars.push(d);
  Object.entries(UI.draftRels).forEach(([oid, t]) => setRel(d.id, oid, t));
  const ok = saveRoster();
  screen = 'roster'; UI.draft = null;
  flash(ok ? `${d.name} saved` : 'Could not save. Check this browser\'s storage');
}

/* ---------- 전투 시험장 설정 ---------- */
const SETUP = { pro: 'haon', c1: 'rian', c2: 'sera', c1st: 'ok', c2st: 'ok', c1bond: '2', c2bond: '3', enc: 'early', stress: '0', supply: '6' };

  const ids = ROSTER.chars.map(c => c.id);
  if (!ids.includes(SETUP.pro)) SETUP.pro = ids[0] || '';
  if (SETUP.c1 && (!ids.includes(SETUP.c1) || SETUP.c1 === SETUP.pro)) SETUP.c1 = '';
  if (SETUP.c2 && (!ids.includes(SETUP.c2) || SETUP.c2 === SETUP.pro || SETUP.c2 === SETUP.c1)) SETUP.c2 = '';
}
function renderSetup() {
  fixSetup();

  const compBlock = (key) => {
    const ch = charById(SETUP[key]);
    const other = key === 'c1' ? SETUP.c2 : SETUP.c1;
    return `<div class="comp-row">
      <label>Companion ${key === 'c1' ? 1 : 2} <select data-k="${key}">${charOpts(SETUP[key], [SETUP.pro, other].filter(Boolean), true)}</select></label>

        <div class="soft small">Companion card ${(() => { const st = compCardStats({ ...ch, bondPts: bondPtsForLevel(ch, +SETUP[key + 'bond']) }); return `attack ${st.atk} · health ${st.hp} · ${SIGILS[ch.sigil].name}`; })()}</div></div></div>

          <label class="inline">Bond <select data-k="${key}bond">${['0', '1', '2', '3'].map(v => opt(v, 'rank ' + v, SETUP[key + 'bond'])).join('')}</select></label>
        </div>` : ''}

function renderCamp() {

    const th = bondThresholds(c); const next = th.find(t => c.bondPts < t);

  };

      return `<button class="btn opt-btn" data-act="camp-talk" data-id="${c.id}">${avatarById(c.id, c.name)}<span><b>${esc(c.name)}</b><small>${esc(est)}${g.why ? `. ${esc(g.why)}` : ''}</small></span></button>`;
    }).join('') || '<p class="soft small">No ally to talk with.</p>';
    const heals = sas.map(c => `<button class="btn opt-btn" data-act="camp-heal" data-id="${c.id}"${canPay ? '' : ' disabled'}>${avatarById(c.id, c.name)}<span><b>Treat ${esc(c.name)}</b><small>Spend ${CAMP_COST} supplies to clear Critical</small></span></button>`).join('') || '<p class="soft small">No ally is Critical.</p>';
    body = `<p class="lead">Rest, clear Critical, or talk. You can do <b>only one</b>.</p>
      <section class="camp-opt"><h2>Rest</h2>
        <button class="btn opt-btn" data-act="camp-rest"${canPay ? '' : ' disabled'}><span><b>Sleep by the fire</b><small>Supplies ${CAMP_COST}, Stress ${r.stress} → ${Math.max(0, r.stress - restAmount(r))}</small></span></button></section>
      <section class="camp-opt"><h2>Clear Critical</h2>${heals}</section>
      <section class="camp-opt"><h2>Talk</h2><p class="soft small">You and an ally talk, and Bond grows.</p>${talks}</section>

  } else {
    const lc = r.lastCamp;
    const scene = lc.kind === 'talk' ? `<div class="scene">${lc.lines.map(l => `<div class="bubble">${l.id === 'pro' ? avatarById(r.pro.id, r.pro.name) : avatarById(l.id, l.who)}<div><b>${esc(l.who)}</b><p>${esc(l.text)}</p></div></div>`).join('')}</div>` : '';
    body = `${scene}<p class="camp-result">${esc(lc.text)}</p>${lc.why ? `<p class="soft small">${esc(lc.why)}</p>` : ''}`;
  }
  app.innerHTML = `<main class="setup camp">
    <h1>Camp</h1>
    ${tipHtml('camp')}
    ${r.mode === 'map' ? `<div class="run-tools"><button class="btn small-btn" data-act="show-deck">Deck · ${r.deck.length}</button>${relicChips()}</div>` : ''}
    <div class="camp-stat">
      <div class="stress"><div class="stress-head"><span>Stress</span><b>${r.stress}</b></div>

/* ---------- 전투 화면 조각 ---------- */
function frontHtml() {
  const m = S.frontMax; const cells = [];
  const fpos = Math.max(-m, Math.min(m, S.front));
  for (let i = -m; i <= m; i++) {
    const cls = ['fc', i < 0 ? 'own' : i > 0 ? 'foe' : 'mid'];
    if (Math.abs(i) >= S.frontPush && i !== 0) cls.push('push');
    if (i === fpos) cls.push('here');
    const fx = UI.fx && (UI.fx.type === 'front') && i === fpos ? `<span class="pop front-pop ${UI.fx.side}">${UI.fx.side === 'p' ? '+' : '−'}${UI.fx.a}</span>` : '';
    cells.push(`<span class="${cls.join(' ')}">${i === fpos ? `<i class="marker${UI.fx && UI.fx.type === 'front' ? ' pulse' : ''}"></i>` : ''}${fx}</span>`);
  }
  let state = '';
  if (S.front <= -S.frontPush) state = 'We are being pushed: Crisis skill is open';
  else if (S.enemyRage) state = `The enemy is raging: enemy attack +${rageAtk()}`;
  else if (S.front >= S.frontPush) state = `The enemy is being pushed: if this holds when the next turn starts, they rage (attack +${rageAtk()})`;
  const fr = UI.focus && UI.focus.range.front;
  const toWin = S.frontMax - S.front, toLose = S.front + S.frontMax;
  return `<div class="front${fr ? ' rg-front' : ''}">
    ${fr ? `<span class="rtag front-tag">${esc(fr)}</span>` : ''}
    ${S.enc.boss ? `<div class="phase-strip${S.phase === 2 ? ' p2' : ''}"><b>Boss phase ${S.phase} / 2</b><span>${S.phase === 1 ? 'Push it all the way and the boss evolves into phase 2' : 'Last phase: push it all the way to win'}</span></div>` : ''}
    <div class="front-head"><span class="end-lose">−${S.frontMax} defeat</span><b class="front-num">Front ${signed(S.front)}</b><span class="end-win">+${S.frontMax} ${S.enc.boss && S.phase === 1 ? 'phase 2' : 'victory'}</span></div>
    <div class="front-track" style="grid-template-columns:repeat(${m * 2 + 1},1fr)">${cells.join('')}</div>
    <div class="front-goal"><span>${toLose > 0 ? `${toLose} to defeat` : 'Past the defeat line'}</span><span class="${toWin <= 0 ? 'over-line' : ''}">${(() => { const goal = S.enc.boss && S.phase === 1 ? 'phase 2' : 'victory'; return toWin > 0 ? `${toWin} to ${goal}` : `Past the ${goal} line (+${-toWin} to spare): hold through the counter and it is ${goal}`; })()}</span></div>
    ${meta().runs ? '' : `<div class="front-rule">An attack that crosses an empty lane pushes the Front by that attack. Win or loss is judged after the enemy's counter, and Stress rises by 2 for each step they push you.</div>`}

}

/* ---------- 공격·방어 범위 ---------- */
function rangeWord(sig, atk) {
  if (atk <= 0) return 'None';
  if (sig.includes('fly')) return 'Flight';
  if (sig.includes('split')) return 'Flanks';
  return 'Front';
}
function rangeLines(sig, atk, kws) {
  const L = [];
  if (atk <= 0) L.push('Does not attack.');
  else if (sig.includes('fly')) L.push('<b>Flight</b>: leaps the card in front and pushes the Front at once (3 at most). If the enemy in front has Watch, it hits that enemy instead.');
  else if (sig.includes('split')) L.push('<b>Twin Strike</b>: attacks the lanes to the left and right instead of its own. An empty side pushes the Front.');
  else L.push('<b>Front</b>: attacks the enemy in front. An empty lane pushes the Front.');
  if (sig.includes('guard')) L.push('<b>Guard</b>: if a neighboring lane is empty, moves there to block an attack aimed at it.');
  if (sig.includes('watch')) L.push('<b>Watch</b>: blocks Flight attacks coming straight in.');
  if (sig.includes('thorn')) L.push('<b>Thorn</b>: a card that attacks this one takes 1 damage.');
  if (sig.includes('cheer')) L.push('<b>Rally</b>: allies on both sides gain +1 attack.');
  if (sig.includes('pierce')) L.push('<b>Pierce</b>: destroys the enemy in front, then pushes the Front with any damage left over.');
  if (kws && kws.includes('devote')) L.push('<b>Devotion</b>: takes 1 of the damage meant for an ally on either side.');
  return L;
}
function rowOf(side) { return side === 'p' ? S.p : side === 'e' ? S.e : S.tele; }
function rangeOf(u, side, lane) {
  const atkSide = side === 't' ? 'e' : side;
  const opp = atkSide === 'p' ? 'e' : 'p';
  const oppRow = rowOf(opp); const ownRow = rowOf(atkSide);
  const res = { cells: [], front: null };
  const add = (sd, ln, kind, tag) => res.cells.push({ side: sd, lane: ln, kind, tag });
  add(side, lane, 'src', '');
  const atk = side === 't' ? u.atk : effAtk(u, side, lane);
  const blocked = atkSide === 'p' && u.sig.includes('coward') && S.stress >= 50;
  if (atk > 0 && !blocked) {
    const lanes = u.sig.includes('split') ? [lane - 1, lane + 1].filter(n => n >= 0 && n < 4) : [lane];
    for (const t of lanes) {
      const d = oppRow[t];
      if (u.sig.includes('fly')) {
        if (d && d.sig.includes('watch')) add(opp, t, 'atk', 'Blocked by Watch');
        else { res.front = 'Flight'; add(opp, t, 'fly', 'Leap and push the gauge'); }
        continue;
      }
      if (d) { add(opp, t, 'atk', `Attack ${atk}`); continue; }
      const g = [t - 1, t + 1].find(n => n >= 0 && n < 4 && oppRow[n] && oppRow[n].sig.includes('guard'));
      if (g !== undefined) { add(opp, t, 'atk', 'Guard steps in'); add(opp, g, 'guard', 'Guard'); }
      else { add(opp, t, 'atk', 'Empty lane, push the gauge'); res.front = `Front ${atk}`; }
    }
  }
  if (u.card && u.card.gift && u.card.gift.note) parts.push(`<p class="soft small">${esc(u.card.gift.note)}</p>`);
  const kws = u.comp ? kwsOf(compById(u.comp)) : [];
  for (const n of [lane - 1, lane + 1]) {
    if (n < 0 || n > 3) continue;
    if (u.sig.includes('cheer')) add(atkSide, n, 'buff', 'Rally +1');
    if (u.sig.includes('guard') && !ownRow[n]) add(atkSide, n, 'guard', 'Guard range');
    if (kws.includes('devote') && ownRow[n]) add(atkSide, n, 'guard', 'Devotion');
  }
  return res;
}
function miniHtml(sig, atk, kws) {
  const top = ['', '', '']; const bot = ['', 'self', ''];
  if (atk > 0) {
    if (sig.includes('fly')) top[1] = 'fly';
    else if (sig.includes('split')) { top[0] = 'atk'; top[2] = 'atk'; }
    else top[1] = 'atk';
  }
  if (sig.includes('cheer')) { bot[0] = 'buff'; bot[2] = 'buff'; }
  if (sig.includes('guard') || (kws && kws.includes('devote'))) { bot[0] = bot[0] || 'guard'; bot[2] = bot[2] || 'guard'; }
  const lab = { atk: 'Attack', fly: 'Leap', buff: 'Rally', guard: sig.includes('guard') ? 'Guard' : 'Devotion', self: 'This card', '': '' };
  const cell = k => `<span class="mc ${k || 'none'}">${lab[k]}</span>`;
  return `<div class="mini">
    <div class="mini-front${sig.includes('fly') && atk > 0 ? ' on' : ''}">Front${sig.includes('fly') && atk > 0 ? ' Flight' : ''}</div>
    <div class="mini-row">${top.map(cell).join('')}</div>
    <div class="mini-row">${bot.map(cell).join('')}</div>
  </div>`;
}

function sigText(sig) { return sig.map(s => SIGILS[s].name).join(' '); }
function slotHtml(u, side, lane) {
  const cls = ['slot', side];
  let targetable = false;

  if (UI.mode === 'cmd') {

    if ((t === 'ally' && side === 'p' && u) || (t === 'enemy' && side === 'e' && u) || (t === 'tele' && side === 't' && u)) targetable = true;
    if (t === 'shift' && side === 'p' && ((UI.from == null && u) || (UI.from != null && !u))) targetable = true;
    if (t === 'shift' && UI.from === lane && side === 'p') cls.push('picked');
  }
  if (targetable) cls.push('target');
  if (UI.castTarget && UI.castTarget.side === side && UI.castTarget.lanes.includes(lane)) cls.push('fx-buff');
  let pop = '';
  const fx = UI.fx;
  if (fx) {
    const opp = fx.side === 'p' ? 'e' : 'p';
    if (['hit', 'front', 'hold'].includes(fx.type) && fx.side === side && fx.aLane === lane) cls.push(`fx-lunge-${side}`);
    if (fx.type === 'hit' && side === opp && fx.t === lane) { cls.push('fx-hit'); pop = `<span class="pop">−${fx.dmg}</span>`; }
    if (fx.type === 'thorn' && side === fx.side && fx.aLane === lane) { cls.push('fx-hit'); pop = `<span class="pop">−${fx.dmg}</span>`; }
    if (fx.type === 'die' && side === fx.side && fx.lane === lane) cls.push('fx-die');
    if (fx.type === 'descend' && side === 'e' && fx.lanes.includes(lane)) cls.push('fx-drop');
    if (fx.type === 'guard' && side === fx.side && fx.to === lane) cls.push('fx-drop');
    if (fx.type === 'poison' && fx.lanes[side] && fx.lanes[side].includes(lane)) { cls.push('fx-hit'); pop = '<span class="pop">−1</span>'; }
    if (fx.type === 'joint' && side === 'p' && fx.lanes.includes(lane)) { cls.push('fx-joint'); }
    if (fx.type === 'joint' && fx.kind === 'comrade' && side === 'e' && fx.target === lane) { cls.push('fx-hit'); pop = '<span class="pop">−1</span>'; }
    if (fx.type === 'grit' && side === 'p' && fx.lane === lane) { cls.push('fx-joint'); pop = `<span class="pop good">${esc(fx.label || 'Grit!')}</span>`; }
    if (fx.type === 'absorb' && side === 'p' && fx.lane === lane) { cls.push('fx-buff'); pop = `<span class="pop good">Stress −${fx.n}</span>`; }
    if (fx.type === 'debuff' && side === 'p' && fx.lane === lane) { cls.push('fx-hit'); pop = `<span class="pop">${esc(fx.label)}</span>`; }
    if (fx.type === 'steal' && side === 't' && fx.lane === lane) { cls.push('fx-drop'); pop = '<span class="pop">Stolen</span>'; }
  }
  let rtag = '';
  if (UI.focus && !UI.fx) {
    const hits = UI.focus.range.cells.filter(c => c.side === side && c.lane === lane);
    for (const h of hits) { cls.push(`rg-${h.kind}`); if (h.tag) rtag = `<span class="rtag ${h.kind}">${esc(h.tag)}</span>`; }
  }
  if (!u) return `<button class="${cls.join(' ')} empty" data-side="${side}" data-lane="${lane}" aria-label="Lane ${lane + 1}, empty">${rtag}</button>`;
  cls.push('unit');
  if (u.comp) cls.push('comp');
  if (u.boss) cls.push('boss-unit');
  else if (u.elite) cls.push('elite-unit');
  const atk = side === 't' ? u.atk : effAtk(u, side, lane);
  const base = side === 't' ? u.atk : u.atk;
  // 판 위 카드는 높이가 정해져 있어 배지를 중요한 순서로 3개까지(넘치면 2개 + 나머지 수)만 보이고 나머지는 +숫자로 줄입니다(전부는 눌러서 설명에)

  </button>`;
}

function tokensHtml() {

function costHtml(cost) {

function handHtml() {

function sigDescList(sig) { return sig.map(s => `<li><b>${SIGILS[s].name}</b>: ${esc(SIGILS[s].desc)}</li>`).join(''); }
function unitInfo(u, side, lane) {
  const why = [];
  const atk = side === 't' ? u.atk : effAtk(u, side, lane, why);
  const whyTxt = why.map(([nm, n]) => `${esc(nm)} ${n > 0 ? '+' : '−'}${Math.abs(n)}`).join(', ');
  const parts = [`<b class="nm">${esc(u.name)}</b> attack ${atk}${why.length && side !== 't' ? ` <span class="soft">(base ${u.atk}, ${whyTxt})</span>` : ''}, health ${u.hp} (max ${u.maxHp})`];
  const kws = u.comp ? kwsOf(compById(u.comp)) : [];
  // 판 위 카드도 손패 카드처럼 공격 범위 그림을 함께 보여 줍니다(예고 줄 적은 목록만)
  const rl = `<ul class="rlist">${rangeLines(u.sig, atk, kws).map(l => `<li>${l}</li>`).join('')}</ul>`;
  parts.push(side === 't' ? rl : `<div class="range-box">${miniHtml(u.sig, atk, kws)}${rl}</div>`);
  const other = u.sig.filter(x => !['fly', 'split', 'guard', 'watch', 'thorn', 'cheer', 'pierce'].includes(x));
  if (other.length) parts.push(`<ul>${sigDescList(other)}</ul>`);
  parts.push('<div class="soft small">The marked lanes are where this card reaches.</div>');
  if (side === 'p' && u.newTurn === S.turn) {

    const why = takeBackWhy(u);
    if (!why) parts.push(`<button class="btn takeback" data-act="takeback" data-lane="${lane}">Recall this card (tokens return)</button>${top && top.uid === u.uid ? '' : '<div class="soft small takeback-note">Other actions (a supply trade, a command) stay. Only this card returns to your hand.</div>'}`);
    else parts.push(`<div class="soft small">${esc(why)}</div>`);

  if (u.comp) {

    parts.push(`<div class="soft">${c.merc ? 'A wandering mercenary: no relationship, Ultimate, or Bond.' : `Keywords: ${kwsOf(c).map(k => KEYWORDS[k].name).join(', ')}. Bond ${bondLevel(c)}.`}${u.saseonAtPlay ? ' They entered Critical, so if they fall, they die.' : ''}</div>`);
    if (side === 'p') parts.push(compExtraHtml(u, lane));

  if (u.poison) parts.push('<div class="soft">Poison: loses 1 health each turn.</div>');

  if (side === 't') parts.push('<div class="soft">On the enemy\'s next turn it drops into this lane. If the lane is full, it waits.</div>');
  return parts.join('');
}

  bgmUpdate();
  if (screen === 'battle' && S && !S.over && !S.startSnd) { S.startSnd = true; sfx(S.enc.boss ? 'startBoss' : 'start'); }
  if (screen === 'battle' && S && S.over && S.overSnd !== S.over) { S.overSnd = S.over; sfx(S.over === 'win' ? 'win' : 'lose'); }
  stressNotices();
  saveRunState();
  if (UI.lastScreen !== screen) {
    UI.lastScreen = screen;
    const m = app.querySelector('main');
    // 새 화면이 팝업·각성 화면과 함께 열릴 때는 화면 전체가 투명에서 시작하면 뒤 배경이 비쳐 번쩍이므로 생략합니다
    if (m && !REDUCED && !app.querySelector('.sheet, .reveal')) { m.classList.add('screen-enter'); setTimeout(() => m.classList.remove('screen-enter'), 260); }
  }
}

/* 스트레스 알림: 공포가 늘어나는 단계를 넘으면 짧은 알림, 100에 닿아 붕괴·각성하면 확인창 */
function stressNotices() {
  if (UI.playing) return;
  const holder = screen === 'battle' && S ? S : RUN;
  if (!holder) return;
  if (holder.breakNote) {
    const { awaken, o } = holder.breakNote;
    if (!holder.breakNote.snd) { holder.breakNote.snd = true; sfx(awaken ? 'awaken' : 'breakdown'); }
    const [head, body] = BREAK_TEXT[o].split(': ');
    app.insertAdjacentHTML('beforeend', `<div class="sheet break-sheet"><div class="sheet-body ${awaken ? 'awaken' : 'collapse'}"><small>The mind's limit</small><h2>${awaken ? 'Awakening' : 'Breakdown'}</h2><p class="break-eff">${esc(body || head)}</p><p class="soft small">${awaken ? 'Past the limit, you came out harder.' : 'Something in you gave way.'} Stress returns to 60. This lasts until the expedition ends.<br><b>Touch 100 once more and you fall. The expedition ends.</b></p><button class="btn primary" data-act="break-ok">All right</button></div></div>`);
    return;
  }
  if (screen === 'battle' && S && S.stressNote) {
    const lv = S.stressNote; S.stressNote = null;
    showFx('stress', `<div class="toast-float stress-toast" role="status">Stress past ${lv} · Fear in the pouch +1${lv >= 75 ? ' · 100 is the mind\'s limit' : ''}</div>`, 2800);
  }
}
function renderSnap(sn) {
  const bak = { p: S.p, e: S.e, tele: S.tele, front: S.front, stress: S.stress, turn: S.turn, phase: S.phase, enemyRage: S.enemyRage };
  Object.assign(S, sn);
  try {
    const battle = app.querySelector('.battle.playing');
    const top = battle && battle.querySelector('.top');
    const board = battle && battle.querySelector('.board');
    const caption = battle && battle.querySelector('.info-row > div');
    if (!top || !board || !caption) { renderBattle(); return; }
    top.innerHTML = frontHtml() + statusHtml();
    board.outerHTML = boardHtml();
    caption.innerHTML = hintHtml();
  } finally { Object.assign(S, bak); }
}
const FX_MS = { debuff: 620, steal: 900, absorb: 520, hit: 560, front: 560, hold: 520, thorn: 420, die: 440, descend: 480, guard: 440, poison: 480, phase: 1000, joint: 1600, grit: 800 };
/* 관계 행동 연출: 판 위 두 사람의 얼굴과 행동 이름을 띠로 보여 줍니다 */
function jointFxHtml(ev) {
  const j = JOINTS[ev.kind] || { name: 'Bond' };
  const us = (ev.lanes || []).map(l => ev.snap.p[l]).filter(u => u && u.comp);
  const ids = ev.ids || us.map(u => u.comp);
  const who = ids.map(id => { const c = S.comps.find(x => x.id === id) || (S.pro.id === id ? S.pro : null); return c ? { id, name: c.name } : null; }).filter(Boolean);
  const text = String(ev.text || '').replace(/^[^:]+:\s*/, '');
  return `<div class="cast joint" aria-live="polite"><div class="cast-band joint-band">${who.length ? `<div class="jb-pair">${who.map(w => avatarById(w.id, w.name, 'lg')).join('')}</div>` : ''}<small>Sync</small><b>${esc(j.name)}</b><span>${esc(text)}</span></div></div>`;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function playEvents(previewDuration = 0) {
  const evs = S.events.slice(); S.events = [];
  if (!evs.length) { render(); return; }
  const phaseChanged = evs.some(ev => ev.type === 'phase');
  UI.playing = true; UI.skip = false;
  try {
    for (const ev of evs) {
      if (UI.skip) break;
      UI.fx = ev;
      renderSnap(ev.snap);
      { const sn = SFX_EVENT[ev.type]; if (sn) sfx(sn(ev)); }
      if (ev.type === 'joint') showFx('joint', jointFxHtml(ev), (previewDuration || FX_MS.joint) * (REDUCED ? 0.6 : 1));
      await sleep(previewDuration || FX_MS[ev.type] * (REDUCED ? 0.6 : 1));
    }
  } finally {
    UI.playing = false; UI.fx = null;
    if (phaseChanged && S.enc.boss && S.phase === 2 && !S.over) UI.phase2IntroReady = true;
    render();
  }
}

/* ---------- 입력 처리 ---------- */
function doCmd(tg) {
  const r = useCommand(tg);
  resetUI();
  if (!r.ok) { flash(r.msg); return; }
  const cm = COMMANDS[S.pro.cmd];
  const target = tg.lane !== undefined ? { side: cm.target === 'enemy' ? 'e' : cm.target === 'tele' ? 't' : 'p', lanes: [tg.lane] } : tg.to !== undefined ? { side: 'p', lanes: [tg.to] } : null;
  castFx('cmd', cm.name, cm.desc, { target });
  render();
}

function onSlot(side, lane) {
  if (S.over) return;
  if (UI.mode === 'play') {
    if (side !== 'p') { flash('You can only play into an empty lane on your side'); return; }
    const r = playCard(UI.sel, lane);
    if (!r.ok) { flash(r.msg || 'You cannot play that'); return; }
    sfx('place');
    resetUI();
    if (S.cutin) { showFx('cutin', cutinHtml(S.cutin), 1800); S.cutin = null; }
    render(); return;
  }
  if (UI.mode === 'cmd') {
    const t = COMMANDS[S.pro.cmd].target;
    if (t === 'ally' && side === 'p') return doCmd({ lane });
    if (t === 'enemy' && side === 'e') return doCmd({ lane });
    if (t === 'tele' && side === 't') return doCmd({ lane });
    if (t === 'shift' && side === 'p') {
      if (UI.from == null) { if (S.p[lane]) { UI.from = lane; render(); } else flash('Tap the ally card to move first'); return; }
      if (lane === UI.from) { UI.from = null; render(); return; }
      return doCmd({ from: UI.from, to: lane });
    }
    flash('That is not a target for this Command'); return;
  }
  const u = side === 'p' ? S.p[lane] : side === 'e' ? S.e[lane] : S.tele[lane];
  if (u && UI.focus && UI.focus.side === side && UI.focus.lane === lane) { resetUI(); render(); return; }
  UI.info = u ? unitInfo(u, side, lane) : null;
  UI.focus = u ? { side, lane, range: rangeOf(u, side, lane) } : null;
  render();
}

function onTok(id) {
  if (S.over) return;
  if (UI.mode === 'exchange') { UI.exTok = id; render(); return; }
  if (UI.mode === 'cmd' && COMMANDS[S.pro.cmd].target === 'token') { UI.exTok = id; render(); return; }
  toggleKeep(id);
  render();
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-hand],[data-side],[data-tok],[data-emo],[data-sac]');
  if (el && !el.disabled && !tutAllow(el)) return;
  if (UI.retryAsk && el && !['retry-confirm', 'retry-cancel'].includes(el.dataset.act)) return;
  if (el && el.dataset.act && !el.disabled && (onGameAct(el.dataset.act, el.dataset) || onRunAct(el.dataset.act, el.dataset) || onMenuAct(el.dataset.act, el.dataset))) return;
  if (!el || el.disabled) return;
  const d = el.dataset;
  if (UI.playing) { if (d.act === 'skip') UI.skip = true; return; }
  if (d.act) {
    switch (d.act) {
      case 'start': startBattle(); return;
      case 'again': startBattle(); return;
      case 'setup': screen = 'setup'; render(); return;
      case 'cancel': resetUI(); render(); return;
      case 'undo': { const lb = undo(); resetUI(); if (lb) flash(`Undone: ${lb}`); else render(); return; }
      case 'takeback': { const r = takeBack(+d.lane); resetUI(); if (!r.ok) flash(r.msg); else { sfx('page'); flash('Recalled the card to your hand'); } return; }
      case 'extra': {
        const r = extraDraw();
        if (r.ok) sfx(r.bust ? 'burst' : r.saved ? 'block' : 'token');
        if (r.bust) flash('Burst! You lost the extra tokens you drew');
        else if (r.saved) flash('Fear came up, but the Burst was avoided');
        render(); return;
      }
      case 'exchange': resetUI(); UI.mode = 'exchange'; render(); return;
      case 'drawcard': { const r = drawExtraCard(); resetUI(); if (!r.ok) flash(r.msg); else { sfx('page'); render(); } return; }
      case 'cmd': {
        const t = COMMANDS[S.pro.cmd].target;
        if (t === 'none') return doCmd({});
        resetUI(); UI.mode = 'cmd'; render(); return;
      }
      case 'crisis': {
        const k = ROLES[S.pro.role].crisis; const r = useCrisis(); resetUI();
        if (r.ok) castFx('crisis', CRISIS[k].name, CRISIS[k].desc, { target: k === 'counter' ? { side: 'p', lanes: [0, 1, 2, 3] } : null });
        render(); return;
      }
      case 'pile-info': UI.pileOpen = true; render(); return;
      case 'close-pile': UI.pileOpen = false; render(); return;
      case 'end': { resetUI(); endTurn(); const top = app.querySelector('.battle .top'); if (top) top.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' }); playEvents(); return; }
      case 'giveup': giveUp(); render(); return;
      case 'ult': {
        const u = S.p[+d.lane]; const c = u && u.comp ? compById(u.comp) : null;
        const r = useUlt(+d.lane); resetUI();
        if (!r.ok) { flash(r.msg); return; }
        const line = [...S.log].reverse().find(l => l.kind === 'line');
        castFx('ult', c.ultName || ULTS[c.role].def, line ? line.text : ULTS[c.role].desc, { id: c.id, who: c.name, target: { side: c.role === 'atk' ? 'e' : 'p', lanes: c.role === 'atk' ? [+d.lane] : [0, 1, 2, 3] } });
        render(); return;
      }
    }
  }
  if (d.hand !== undefined) {
    const i = +d.hand;
    if (UI.mode === 'play' && UI.sel === i) { resetUI(); render(); return; }
    resetUI(); UI.mode = 'play'; UI.sel = i; UI.info = cardInfoHtml(S.hand[i]); render(); return;
  }
  if (d.side) { onSlot(d.side, +d.lane); return; }
  if (d.tok) { onTok(+d.tok); return; }
  if (d.emo && UI.mode === 'cmd') { doCmd({ tok: UI.exTok, emo: d.emo }); return; }
  if (d.emo) { const r = exchange(UI.exTok, d.emo); resetUI(); if (!r.ok) flash(r.msg); else { sfx('token'); render(); } return; }
  if (d.sac) { sacrifice(d.sac); render(); }
});

function onMenuAct(act, d) {
  switch (act) {
    case 'to-roster': screen = 'roster'; render(); window.scrollTo(0, 0); return true;
    case 'boss-ok': fadeReveal(() => { UI.bossSeen = true; render(); }); return true;
    case 'phase-ok': fadeReveal(() => { UI.phase2Seen = true; UI.phase2IntroReady = false; render(); }); return true;
    case 'to-camp': syncOnce(); screen = 'camp'; resetUI(); render(); window.scrollTo(0, 0); return true;
    case 'next-battle': syncOnce(); startRunBattle(SETUP.enc); return true;
    case 'depart': startRunBattle(SETUP.enc); return true;
    case 'camp-rest': case 'camp-heal': case 'camp-talk': {
      const r = act === 'camp-rest' ? campRest(RUN) : act === 'camp-heal' ? campHeal(RUN, d.id) : campTalk(RUN, d.id);
      if (!r.ok) flash(r.msg); else render();
      return true;
    }
    case 'to-setup': screen = 'setup'; render(); window.scrollTo(0, 0); return true;
    case 'new-char': if (ROSTER.chars.length < rosterSlots()) openEditor(blankChar()); return true;
    case 'edit-char': openEditor(charById(d.id)); return true;
    case 'cancel-edit': screen = 'roster'; UI.draft = null; render(); return true;
    case 'save-char': saveDraft(); return true;
    case 'clear-portrait': UI.draft.portrait = null; render(); return true;
    case 'show-code': UI.showCode = !UI.showCode; render(); return true;
    case 'copy-code': {
      const ta = app.querySelector('textarea[data-f=codeout]');
      const done = () => flash('Copied the code');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); flash('Copy is blocked. Copy the selected code yourself'); });
      else { ta.select(); flash('Copy the selected code yourself'); }
      return true;
    }
    case 'delete-char': {
      if (!UI.confirmDel) { UI.confirmDel = true; render(); return true; }
      const id = UI.draft.id;
      ROSTER.chars = ROSTER.chars.filter(c => c.id !== id);
      ROSTER.rels = ROSTER.rels.filter(r => r.a !== id && r.b !== id);
      saveRoster(); screen = 'roster'; UI.draft = null; flash('Deleted'); return true;
    }
    case 'import-char': {
      const ch = parseCharCode(UI.importText);
      if (!ch) { flash('Could not read the code. Check that you pasted all of it'); return true; }
      if (ROSTER.chars.length >= rosterSlots()) { flash('Every slot is full'); return true; }
      ch.id = newCharId(); ROSTER.chars.push(ch); saveRoster(); UI.importText = '';
      flash(`Loaded ${ch.name}. Add a portrait from Edit`); return true;
    }
  }
  return false;
}

app.addEventListener('input', e => {
  if (screen !== 'craft' || !e.target.closest('[data-craft-form]') || e.target.matches('[type=file]')) return;
  const d = craftReadDraft(); const pv = app.querySelector('.ws-card-preview'); if (pv) pv.innerHTML = craftPreviewHtml(craftClamp({ ...d }));
  if (UI.craft.code) { UI.craft.code = ''; const cb = app.querySelector('.ws-code-box'); if (cb) cb.remove(); }
});
app.addEventListener('change', e => {
  const t = e.target;
  if (screen === 'craft' && t.matches && t.matches('[data-craft-base]')) { UI.craft.draft = wsDefault(t.value); UI.craft.code = ''; render(); return; }
  if (screen === 'craft' && t.matches && t.matches('[data-craft-image]') && t.files && t.files[0]) { const f = t.files[0]; craftReadDraft(); wsImage(f).then(img => { UI.craft.draft.image = img; UI.craft.imageName = f.name; UI.craft.code = ''; render(); }, err => flash(err.message || 'Could not read the picture')); return; }
  if (t.matches && t.matches('[data-save-file]') && t.files && t.files[0]) {
    if (t.files[0].size > 20 * 1024 * 1024) { flash('That file is too large'); return; }
    const fname = t.files[0].name;
    t.files[0].text().then(txt => { UI.saveImportText = txt.trim(); UI.saveFileName = fname; UI.saveImportOpen = true; UI.saveImportAsk = false; flash('File read. Tap Import'); }, () => flash('Could not read the file'));
    return;
  }
  if (t.dataset.p) { PREP[t.dataset.p] = t.value; UI.confirmNew = false; render(); return; }
  if (t.dataset.k) { SETUP[t.dataset.k] = t.value; render(); return; }
  if (screen === 'edit' && UI.draft) {
    const f = t.dataset.f;
    if (f === 'portrait' && t.files && t.files[0]) {
      readPortrait(t.files[0]).then(url => { UI.draft.portrait = url; render(); }, () => flash('Could not read the image'));
      return;
    }
    if (['role', 'cmd', 'sigil', 'core', 'speech'].includes(f)) { UI.draft[f] = t.value; render(); return; }
    if (f === 'aux0' || f === 'aux1') { UI.draft.aux[+f.slice(3)] = t.value; render(); return; }
    if (t.dataset.rel !== undefined) { UI.draftRels[t.dataset.rel] = t.value; return; }
  }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (screen === 'edit' && UI.draft) {
    if (t.dataset.f === 'ultName') UI.draft.ultName = t.value;
    if (t.dataset.f === 'name') { UI.draft.name = t.value; const b = app.querySelector('[data-act=save-char]'); if (b) { const v = draftValid(UI.draft); b.disabled = !v; b.textContent = v ? 'Save' : 'Check the name and the keywords'; } }
    if (t.dataset.line) UI.draft.lines[t.dataset.line] = t.value;
  }
  if (t.dataset.f === 'import') UI.importText = t.value;
});
app.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.vol) return;
  const v = Math.max(0, Math.min(100, +t.value)) / 100, m = meta();
  m[t.dataset.vol === 'bgm' ? 'bgmVol' : 'sfxVol'] = v;
  const b = t.parentElement && t.parentElement.querySelector('b'); if (b) b.textContent = Math.round(v * 100);
  sndInit(); sndApplyPrefs();
});
app.addEventListener('change', e => { const t = e.target; if (!t.dataset || !t.dataset.vol) return; saveMeta(); if (t.dataset.vol === 'sfx') sfx('tap'); });
app.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.log')) UI.logOpen = e.target.open; }, true);

render();
workshopBoot();
</script>
</body>
